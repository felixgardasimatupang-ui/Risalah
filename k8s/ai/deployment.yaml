apiVersion: apps/v1
kind: Deployment
metadata:
  name: risalah-ai
  namespace: risalah-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risalah-ai
  template:
    metadata:
      labels:
        app: risalah-ai
    spec:
      containers:
        - name: ai
          image: ghcr.io/risalah-sekneg/risalah-ai:latest
          ports:
            - containerPort: 8000
          env:
            - name: RISALAH_WHISPER_DEVICE
              value: cpu
            - name: RISALAH_USE_GPU
              value: "false"
            - name: RISALAH_CELERY_BROKER_URL
              value: redis://risalah-redis.risalah-data.svc.cluster.local:6379/0
            - name: RISALAH_CELERY_RESULT_BACKEND
              value: redis://risalah-redis.risalah-data.svc.cluster.local:6379/1
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: risalah-ai
  namespace: risalah-ai
spec:
  selector:
    app: risalah-ai
  ports:
    - port: 8000
      targetPort: 8000
      name: http
    - port: 9090
      targetPort: 9090
      name: metrics
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: risalah-ai-gpu
  namespace: risalah-ai
spec:
  selector:
    app: risalah-ai-gpu
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risalah-ai-gpu
  namespace: risalah-ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: risalah-ai-gpu
  template:
    metadata:
      labels:
        app: risalah-ai-gpu
    spec:
      containers:
        - name: ai-gpu
          image: ghcr.io/risalah-sekneg/risalah-ai-gpu:latest
          ports:
            - containerPort: 8000
          resources:
            requests:
              cpu: "4"
              memory: "16Gi"
              nvidia.com/gpu: 1
            limits:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: 1
