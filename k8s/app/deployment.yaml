apiVersion: apps/v1
kind: Deployment
metadata:
  name: risalah-app
  namespace: risalah-app
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: risalah-app
  template:
    metadata:
      labels:
        app: risalah-app
    spec:
      containers:
        - name: app
          image: ghcr.io/risalah-sekneg/risalah-app:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: risalah-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: risalah-secrets
                  key: jwt-secret
            - name: AI_SERVICE_URL
              value: http://risalah-ai.risalah-ai.svc.cluster.local:8000
            - name: REDIS_URL
              value: redis://risalah-redis.risalah-data.svc.cluster.local:6379
            - name: NODE_ENV
              value: production
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: risalah-app
  namespace: risalah-app
spec:
  selector:
    app: risalah-app
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
