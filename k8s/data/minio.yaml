apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: risalah-minio
  namespace: risalah-data
spec:
  serviceName: risalah-minio
  replicas: 1
  selector:
    matchLabels:
      app: risalah-minio
  template:
    metadata:
      labels:
        app: risalah-minio
    spec:
      containers:
        - name: minio
          image: minio/minio:latest
          args: ["server", "/data", "--console-address", ":9001"]
          ports:
            - containerPort: 9000
            - containerPort: 9001
          env:
            - name: MINIO_ROOT_USER
              value: risalah
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: risalah-secrets
                  key: minio-password
          volumeMounts:
            - name: minio-data
              mountPath: /data
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
  volumeClaimTemplates:
    - metadata:
        name: minio-data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Ti
---
apiVersion: v1
kind: Service
metadata:
  name: risalah-minio
  namespace: risalah-data
spec:
  selector:
    app: risalah-minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
  type: ClusterIP
