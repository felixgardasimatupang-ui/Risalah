apiVersion: apps/v1
kind: Deployment
metadata:
  name: risalah-app
spec:
  replicas: 3
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      containers:
        - name: app
          env:
            - name: NODE_ENV
              value: production
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          readinessProbe:
            httpGet:
              path: /api/auth/me
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/auth/me
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: risalah-ai
  namespace: risalah-ai
spec:
  replicas: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    spec:
      containers:
        - name: ai
          env:
            - name: RISALAH_USE_GPU
              value: "true"
            - name: RISALAH_LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
              nvidia.com/gpu: "1"
            limits:
              cpu: "8"
              memory: "32Gi"
              nvidia.com/gpu: "1"
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 15
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 30
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: risalah-config
data:
  APP_URL: "https://app.risalah.sekneg.go.id"
  AI_MODEL_SIZE: "large-v3"
  WHISPER_MODEL: "large-v3"
  CORS_ORIGINS: "https://app.risalah.sekneg.go.id"
  CELERY_CONCURRENCY: "2"
