name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_APP: ${{ github.repository }}-app
  IMAGE_AI: ${{ github.repository }}-ai

jobs:
  test:
    name: Pre-deployment Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test

  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - context: .
            dockerfile: Dockerfile
            image: ${{ github.repository }}-app
          - context: services/ai-service
            dockerfile: Dockerfile
            image: ${{ github.repository }}-ai
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ matrix.image }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [docker]
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Deploy App
        run: |
          kubectl set image deployment/risalah-app \
            app=${{ env.REGISTRY }}/${{ env.IMAGE_APP }}:${{ github.sha }} \
            --namespace=risalah-app --record

      - name: Deploy AI Service
        run: |
          kubectl set image deployment/risalah-ai \
            ai=${{ env.REGISTRY }}/${{ env.IMAGE_AI }}:${{ github.sha }} \
            --namespace=risalah-ai --record

      - name: Wait for App Rollout
        run: kubectl rollout status deployment/risalah-app -n risalah-app --timeout=5m

      - name: Wait for AI Rollout
        run: kubectl rollout status deployment/risalah-ai -n risalah-ai --timeout=5m

      - name: Health Check
        run: |
          sleep 10
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            https://staging.risalah.sekneg.go.id/api/auth/me)
          if [ "$STATUS" != "200" ]; then
            echo "❌ Staging health check failed (HTTP $STATUS)"
            exit 1
          fi
          echo "✅ Staging health check passed"

      - name: Smoke Test
        run: |
          # Test login page loads
          curl -s -o /dev/null -w "%{http_code}" \
            https://staging.risalah.sekneg.go.id/login | grep 200

          # Test API responds
          curl -s -o /dev/null -w "%{http_code}" \
            https://staging.risalah.sekneg.go.id/api/auth/me | grep 200

          # Test AI service
          curl -s -o /dev/null -w "%{http_code}" \
            http://risalah-ai.risalah-ai.svc.cluster.local:8000/api/v1/health | grep 200

  deploy-uat:
    name: Deploy to UAT
    runs-on: ubuntu-latest
    needs: [deploy-staging]
    environment: uat
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4

      - name: Deploy to UAT
        run: |
          kubectl set image deployment/risalah-app \
            app=${{ env.REGISTRY }}/${{ env.IMAGE_APP }}:${{ github.sha }} \
            --namespace=risalah-app --record
          kubectl rollout status deployment/risalah-app -n risalah-app --timeout=5m

      - name: UAT Health Check
        run: |
          sleep 10
          curl -s -f https://uat.risalah.sekneg.go.id/api/auth/me > /dev/null
          echo "✅ UAT deployment successful"

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [deploy-uat]
    environment: production
    concurrency: production
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-kubectl@v4

      - name: Create Git Tag
        run: |
          TAG="release-$(date +%Y%m%d-%H%M%S)"
          git tag $TAG ${{ github.sha }}
          git push origin $TAG

      - name: Deploy App (zero-downtime)
        run: |
          kubectl set image deployment/risalah-app \
            app=${{ env.REGISTRY }}/${{ env.IMAGE_APP }}:${{ github.sha }} \
            --namespace=risalah-app --record
          kubectl rollout status deployment/risalah-app -n risalah-app --timeout=10m

      - name: Deploy AI Service (zero-downtime)
        run: |
          kubectl set image deployment/risalah-ai \
            ai=${{ env.REGISTRY }}/${{ env.IMAGE_AI }}:${{ github.sha }} \
            --namespace=risalah-ai --record
          kubectl rollout status deployment/risalah-ai -n risalah-ai --timeout=10m

      - name: Production Health Check
        run: |
          sleep 15
          for i in 1 2 3 4 5; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              https://app.risalah.sekneg.go.id/api/auth/me)
            if [ "$STATUS" = "200" ]; then
              echo "✅ Production health check passed (attempt $i)"
              exit 0
            fi
            echo "   Attempt $i/5: HTTP $STATUS, retrying..."
            sleep 5
          done
          echo "❌ Production health check failed after 5 attempts"
          exit 1

      - name: Post-Deployment Notification
        run: |
          echo "✅ Production deployment complete"
          echo "   Commit: ${{ github.sha }}"
          echo "   Release: release-$(date +%Y%m%d-%H%M%S)"
