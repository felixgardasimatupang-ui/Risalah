global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: risalah-app
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [risalah-app]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: risalah-app
        action: keep
      - source_labels: [__address__]
        action: replace
        regex: ([^:]+)(?::\d+)?
        replacement: $1:3000
        target_label: __address__

  - job_name: risalah-ai
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [risalah-ai]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: risalah-ai
        action: keep
      - source_labels: [__address__]
        action: replace
        regex: ([^:]+)(?::\d+)?
        replacement: $1:9090
        target_label: __address__

  - job_name: postgres-exporter
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [risalah-data]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: risalah-postgres-exporter
        action: keep

  - job_name: redis-exporter
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [risalah-data]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: risalah-redis-exporter
        action: keep
